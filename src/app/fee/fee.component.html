<style>
    .hm {
        min-height: 100vh;
        background:
            linear-gradient(rgba(15, 23, 42, .45), rgba(15, 23, 42, .45)),
            url('assets/files/add.png');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        padding-top: 90px;
        padding-bottom: 40px;
    }

    .card {
        border: none;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 18px 40px rgba(0, 0, 0, .30);
        animation: fadeIn .7s;
    }

    .card-header {
        background: linear-gradient(90deg, #0f4c81, #2193b0, #36d1dc);
        color: white;
        text-align: center;
        padding: 18px;
    }

    .card-body {
        background: rgba(255, 255, 255, .97);
    }

    .input-group-text {
        background: linear-gradient(45deg, #0f4c81, #2193b0);
        color: white;
        border: none;
        width: 48px;
        justify-content: center;
    }

    .form-control {
        height: 48px;
        border-radius: 0 10px 10px 0;
    }

    .form-control:focus {
        border-color: #2193b0;
        box-shadow: 0 0 8px rgba(33, 147, 176, .35);
    }

    label {
        font-weight: 600;
        color: #0f4c81;
    }

    .btn-save {
        background: linear-gradient(45deg, #11998e, #38ef7d);
        color: white;
        border: none;
        border-radius: 30px;
        padding: 10px 35px;
    }

    .btn-list {
        background: linear-gradient(45deg, #ffb347, #ffcc33);
        color: #222;
        border: none;
        border-radius: 30px;
        padding: 10px 35px;
    }

    .alert {
        border-radius: 10px;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(20px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>

<app-navbar></app-navbar>

<div class="hm">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-6 col-md-8">

                <div class="card">

                    <div class="card-header">

                        <h3 *ngIf="!form.data.id">
                            <i class="fa fa-money"></i>
                            Add Fee Details
                        </h3>

                        <h3 *ngIf="form.data.id>0">
                            <i class="fa fa-edit"></i>
                            Update Fee Details
                        </h3>

                    </div>

                    <div class="card-body">

                        <div *ngIf="!form.error && form.message" class="alert alert-success text-center">

                            {{form.message}}

                        </div>

                        <div *ngIf="form.error && form.message" class="alert alert-danger text-center">

                            {{form.message}}

                        </div>

                        <form (ngSubmit)="submit()">

                            <!-- Student Name -->

                            <div class="form-group">

                                <label>

                                    <i class="fa fa-user-graduate"></i>

                                    Student Name

                                    <span style="color:red">*</span>

                                </label>

                                <div class="input-group">

                                    <div class="input-group-prepend">

                                        <span class="input-group-text">

                                            <i class="fa fa-user"></i>

                                        </span>

                                    </div>

                                    <input type="text" class="form-control" name="studentName"
                                        [(ngModel)]="form.data.studentName" placeholder="Enter Student Name">

                                </div>

                                <small class="text-danger">

                                    {{form.inputerror.studentName}}

                                </small>

                            </div>

                            <!-- Amount -->

                            <div class="form-group">

                                <label>

                                    <i class="fa fa-wallet"></i>

                                    Amount

                                    <span style="color:red">*</span>

                                </label>

                                <div class="input-group">

                                    <div class="input-group-prepend">

                                        <span class="input-group-text">

                                           <i class="bi bi-bank"></i>

                                        </span>

                                    </div>

                                    <input type="text" class="form-control" name="amount" [(ngModel)]="form.data.amount"
                                        placeholder="Enter Amount">

                                </div>

                                <small class="text-danger">

                                    {{form.inputerror.amount}}

                                </small>

                            </div>
                            <!-- Payment Date -->

                            <div class="form-group">

                                <label>

                                    <i class="fa fa-calendar-alt"></i>

                                    Payment Date

                                    <span style="color:red">*</span>

                                </label>

                                <div class="input-group">

                                    <div class="input-group-prepend">

                                        <span class="input-group-text">

                                            <i class="fa fa-calendar"></i>

                                        </span>

                                    </div>

                                    <input type="date" class="form-control" name="paymentDate"
                                        [(ngModel)]="form.data.paymentDate">

                                </div>

                                <small class="text-danger">

                                    {{form.inputerror.paymentDate}}

                                </small>

                            </div>

                            <!-- Payment Status -->

                            <div class="form-group">

                                <label>

                                    <i class="fa fa-credit-card"></i>Payment Status

                                    <span style="color:red">*</span>

                                </label>

                                <div class="input-group">

                                    <div class="input-group-prepend">

                                        <span class="input-group-text">

                                            <i class="fa fa-check-circle"></i>

                                        </span>

                                    </div>

                                    <select class="form-control" name="paymentStatus"
                                        [(ngModel)]="form.data.paymentStatus">

                                        <option value="">Payment Status</option>

                                        <option value="Paid">✔ Paid</option>

                                        <option value="Pending">⏳ Pending</option>

                                        <option value="Failed">✖ Failed</option>

                                    </select>

                                </div>

                                <small class="text-danger">

                                    {{form.inputerror.paymentStatus}}

                                </small>

                            </div>

                            <div class="text-center mt-4">

                                <button type="submit" class="btn btn-save mr-3">

                                    <i class="fa fa-save"></i>

                                    Save

                                </button>

                                <button type="button" class="btn btn-list" (click)="forward('/feelist')">

                                    <i class="fa fa-list"></i>

                                    Fee List

                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<app-footer></app-footer>
