<style type="text/css">
    .input-group-addon {
        box-shadow: 9px 8px 7px #001a33;
    }

    .hm {
        background-image: url('assets/files/add.png');
        background-repeat: no-repeat;
        background-attachment: fixed;
        background-size: cover;
        padding-top: 5px;
        padding-bottom: 25px;
    }
</style>

<app-navbar></app-navbar>

<br><br><br>

<div class="hm">
    <main>
        <div class="row pt-3">

            <div class="col-md-4 mb-4"></div>

            <div class="col-md-4 mb-4">
                <div class="card input-group-addon">
                    <div class="card-body">

                        <h3 *ngIf="!form.data.id" class="text-center default-text text-dark">
                            Add Department
                        </h3>

                        <h3 *ngIf="form.data.id > 0" class="text-center default-text text-dark">
                            Update Department
                        </h3>

                        <div>
                            <h4 align="center">
                                <div *ngIf="!form.error && form.message" class="alert alert-success alert-dismissible">
                                    <button type="button" class="close" data-dismiss="alert">&times;</button>
                                    {{form.message}}
                                </div>
                            </h4>

                            <h4 align="center">
                                <div *ngIf="form.error && form.message" class="alert alert-danger alert-dismissible">
                                    <button type="button" class="close" data-dismiss="alert">&times;</button>
                                    {{form.message}}
                                </div>
                            </h4>
                        </div>

                        <form (ngSubmit)="submit()">

                            <div class="md-form">

                                <!-- Department Name -->

                                <span class="pl-sm-5">
                                    <b>Department Name</b>
                                    <span style="color:red">*</span>
                                </span><br>

                                <div class="col-sm-12">
                                    <div class="input-group">

                                        <div class="input-group-prepend">
                                            <div class="input-group-text">
                                                <i class="fa fa-building"></i>
                                            </div>
                                        </div>

                                        <input type="text" class="form-control" name="departmentName"
                                            [(ngModel)]="form.data.departmentName" placeholder="Enter Department Name">

                                    </div>
                                </div>

                                <font color="red" class="pl-sm-5">
                                    {{form.inputerror.departmentName}}
                                </font>

                                <br>

                                <!-- HOD Name -->

                                <span class="pl-sm-5">
                                    <b>HOD Name</b>
                                    <span style="color:red">*</span>
                                </span><br>

                                <div class="col-sm-12">
                                    <div class="input-group">

                                        <div class="input-group-prepend">
                                            <div class="input-group-text">
                                                <i class="fa fa-user"></i>
                                            </div>
                                        </div>

                                        <input type="text" class="form-control" name="hodName"
                                            [(ngModel)]="form.data.hodName" placeholder="Enter HOD Name">

                                    </div>
                                </div>

                                <font color="red" class="pl-sm-5">
                                    {{form.inputerror.hodName}}
                                </font>

                                <br>

                                <!-- Total Faculty -->

                                <span class="pl-sm-5">
                                    <b>Total Faculty</b>
                                    <span style="color:red">*</span>
                                </span><br>

                                <div class="col-sm-12">
                                    <div class="input-group">

                                        <div class="input-group-prepend">
                                            <div class="input-group-text">
                                                <i class="fa fa-users"></i>
                                            </div>
                                        </div>

                                        <input type="text" class="form-control" name="totalFaculty"
                                            [(ngModel)]="form.data.totalFaculty" placeholder="Enter Total Faculty">

                                    </div>
                                </div>

                                <font color="red" class="pl-sm-5">
                                    {{form.inputerror.totalFaculty}}
                                </font>

                                <br>

                                <!-- Location -->

                                <span class="pl-sm-5">
                                    <b>Location</b>
                                    <span style="color:red">*</span>
                                </span><br>

                                <div class="col-sm-12">
                                    <div class="input-group">

                                        <div class="input-group-prepend">
                                            <div class="input-group-text">
                                                <i class="fa fa-map-marker"></i>
                                            </div>
                                        </div>

                                        <input type="text" class="form-control" name="location"
                                            [(ngModel)]="form.data.location" placeholder="Enter Location">

                                    </div>
                                </div>

                                <font color="red" class="pl-sm-5">
                                    {{form.inputerror.location}}
                                </font>

                                <br>

                                <!-- Buttons -->

                                <div class="text-center">

                                    <button type="submit" class="btn btn-success" style="font-size:17px">
                                        Save
                                    </button>

                                    &nbsp;

                                    <button type="button" class="btn btn-warning" style="font-size:17px"
                                        (click)="forward('/departmentlist')">
                                        List
                                    </button>

                                </div>

                            </div>

                        </form>

                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-4"></div>

        </div>
    </main>
</div>

<app-footer></app-footer>
