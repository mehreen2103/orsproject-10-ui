<style>
  .profile-bg {
    min-height: 100vh;
    padding: 40px 0;
    background: linear-gradient(135deg, #edf4ff, #f6f1ff, #eefaf2);
  }

  .profile-card {
    border: none;
    border-radius: 22px;
    background: rgba(255, 255, 255, .95);
    backdrop-filter: blur(12px);
    box-shadow: 0 15px 45px rgba(0, 0, 0, .18);
    transition: .4s;
  }

  .profile-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 20px 55px rgba(0, 0, 0, .22);
  }

  .form-label {
    font-weight: 600;
    color: #1f3b73;
  }

  .input-group-text {
    background: linear-gradient(135deg, #0d6efd, #6f42c1);
    color: #fff;
    border: none;
  }

  .form-control,
  .form-select {
    border-left: none;
    transition: .3s;
  }

  .form-control:focus,
  .form-select:focus {
    border-color: #6f42c1;
    box-shadow: 0 0 10px rgba(111, 66, 193, .35);
  }

  .btn-success {
    background: linear-gradient(135deg, #28a745, #20c997);
    border: none;
    box-shadow: 0 6px 15px rgba(40, 167, 69, .35);
  }

  .btn-success:hover {
    transform: translateY(-2px);
  }

  .btn-primary {
    background: linear-gradient(135deg, #0d6efd, #6610f2);
    border: none;
    box-shadow: 0 6px 15px rgba(13, 110, 253, .35);
  }

  .btn-primary:hover {
    transform: translateY(-2px);
  }

  .profile-title {
    font-weight: bold;
    color: #16325c;
    text-shadow: 2px 2px 10px rgba(0, 0, 0, .1);
  }
</style>

<app-navbar></app-navbar>

<div class="profile-bg">

  <div class="container py-5">

    <div class="row justify-content-center">

      <div class="col-lg-10">

        <div class="card profile-card">

          <div class="card-body p-5">

            <h2 class="text-center profile-title mb-5">
              My Profile
            </h2>

            <div *ngIf="form.message" class="alert alert-dismissible fade show"
              [ngClass]="form.error ? 'alert-danger':'alert-success'">

              {{form.message}}

              <button type="button" class="btn-close" data-bs-dismiss="alert" (click)="form.message=''">
              </button>

            </div>

            <form (ngSubmit)="myProfile()" #profileForm="ngForm">

              <!-- First Name & Last Name -->

              <div class="row">

                <div class="col-md-6 mb-4">

                  <label class="form-label">
                    First Name <span class="text-danger">*</span>
                  </label>

                  <div class="input-group">

                    <span class="input-group-text">
                      <i class="fas fa-user"></i>
                    </span>

                    <input type="text" class="form-control" name="firstName" [(ngModel)]="form.data.firstName"
                      placeholder="Enter First Name" required>

                  </div>

                  <small class="text-danger">
                    {{form.inputerror.firstName}}
                  </small>

                </div>

                <div class="col-md-6 mb-4">

                  <label class="form-label">
                    Last Name <span class="text-danger">*</span>
                  </label>

                  <div class="input-group">

                    <span class="input-group-text">
                      <i class="fas fa-user"></i>
                    </span>

                    <input type="text" class="form-control" name="lastName" [(ngModel)]="form.data.lastName"
                      placeholder="Enter Last Name" required>

                  </div>

                  <small class="text-danger">
                    {{form.inputerror.lastName}}
                  </small>

                </div>

              </div>

              <!-- Login ID & DOB -->

              <div class="row">

                <div class="col-md-6 mb-4">

                  <label class="form-label">
                    Login Id <span class="text-danger">*</span>
                  </label>

                  <div class="input-group">

                    <span class="input-group-text">
                      <i class="fas fa-envelope"></i>
                    </span>

                    <input type="text" class="form-control" name="loginId" [(ngModel)]="form.data.loginId" readonly
                      placeholder="Enter Login ID">

                  </div>

                  <small class="text-danger">
                    {{form.inputerror.loginId}}
                  </small>

                </div>

                <div class="col-md-6 mb-4">

                  <label class="form-label">
                    Date of Birth <span class="text-danger">*</span>
                  </label>

                  <div class="input-group">

                    <span class="input-group-text">
                      <i class="fas fa-calendar-alt"></i>
                    </span>

                    <input type="date" class="form-control" name="dob" [(ngModel)]="form.data.dob"
                      [ngModel]="form.data.dob | date:'yyyy-MM-dd'" required>

                  </div>

                  <small class="text-danger">
                    {{form.inputerror.dob}}
                  </small>

                </div>

              </div>
              <!-- Gender & Mobile -->

              <div class="row">

                <div class="col-md-6 mb-4">

                  <label class="form-label">
                    Gender <span class="text-danger">*</span>
                  </label>

                  <div class="input-group">

                    <span class="input-group-text">
                      <i class="fas fa-venus-mars"></i>
                    </span>

                    <select class="form-select" name="gender" [(ngModel)]="form.data.gender" required>

                      <option value="">------------Select------------</option>
                      <option value="Male">Male</option>
                      <option value="Female">Female</option>

                    </select>

                  </div>

                  <small class="text-danger">
                    {{form.inputerror.gender}}
                  </small>

                </div>

                <div class="col-md-6 mb-4">

                  <label class="form-label">
                    Mobile <span class="text-danger">*</span>
                  </label>

                  <div class="input-group">

                    <span class="input-group-text">
                      <i class="fas fa-phone"></i>
                    </span>

                    <input type="text" class="form-control" name="phone" [(ngModel)]="form.data.phone" maxlength="10"
                      placeholder="Enter Mobile No." required>

                  </div>

                  <small class="text-danger">
                    {{form.inputerror.phone}}
                  </small>

                </div>

              </div>

              <!-- Buttons -->

              <div class="text-center mt-4">

                <button type="submit" class="btn btn-success btn-lg px-5 me-3">

                  <i class="fas fa-save me-2"></i>
                  Save

                </button>

                <button type="button" class="btn btn-primary btn-lg px-5" (click)="forward('/userlist')">

                  <i class="fas fa-list me-2"></i>
                  List

                </button>

              </div>

            </form>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>

<app-footer></app-footer>
