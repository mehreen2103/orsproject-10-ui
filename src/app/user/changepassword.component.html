<style>
    .container {
        min-height: 85vh;
        padding-top: 35px;
    }

    .card {
        border: none;
        border-radius: 16px;
        overflow: hidden;
        transition: .3s;
        box-shadow: 0 12px 30px rgba(0, 0, 0, .18);
    }

    .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 18px 40px rgba(0, 0, 0, .25);
    }

    .card-header {
        background: linear-gradient(90deg, #233945, #2f4d5a);
        color: white;
        border: none;
    }

    .card-header h2 {
        margin: 0;
        font-weight: 600;
    }

    .card-body {
        background: #f8fafc;
    }

    .form-label {
        color: #233945;
        font-weight: 600;
    }

    .form-control {
        border-radius: 10px;
        height: 46px;
        border: 1px solid #ced4da;
    }

    .form-control:focus {
        border-color: #233945;
        box-shadow: 0 0 0 .2rem rgba(35, 57, 69, .15);
    }

    .btn-primary {
        background: #233945;
        border-color: #233945;
        border-radius: 10px;
        height: 46px;
        font-size: 17px;
        font-weight: 600;
        transition: .3s;
    }

    .btn-primary:hover {
        background: #2f4d5a;
        border-color: #2f4d5a;
    }

    .alert {
        border-radius: 10px;
    }

    .text-danger {
        font-size: 14px;
    }
</style>

<app-navbar></app-navbar>

<br><br><br>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-lg-5 col-md-7 col-sm-10">

            <div class="card">

                <div class="card-header text-center py-3">
                    <h2>
                        <i class="fa fa-lock me-2"></i>
                        Change Password
                    </h2>
                </div>

                <div class="card-body p-4">

                    <div *ngIf="!form.error && form.message"
                        class="alert alert-success text-center">
                        {{form.message}}
                    </div>

                    <div *ngIf="form.error && form.message"
                        class="alert alert-danger text-center">
                        {{form.message}}
                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Old Password <span class="text-danger">*</span>
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            name="oldPassword"
                            [(ngModel)]="form.data.oldPassword"
                            placeholder="Enter Old Password">

                        <small class="text-danger">
                            {{form.inputerror.oldPassword}}
                        </small>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">
                            New Password <span class="text-danger">*</span>
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            name="newPassword"
                            [(ngModel)]="form.data.newPassword"
                            placeholder="Enter New Password">

                        <small class="text-danger">
                            {{form.inputerror.newPassword}}
                        </small>

                    </div>

                    <div class="d-grid">

                        <button
                            class="btn btn-primary"
                            (click)="changePassword()">

                            <i class="fa fa-key me-2"></i>
                            Change Password

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<app-footer></app-footer>
