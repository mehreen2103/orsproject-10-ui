<style>
    .assignment-bg {
        min-height: 100vh;
        background: linear-gradient(135deg, #edf4f7, #f8fbfc);
        padding-top: 100px;
        padding-bottom: 50px;
    }

    .assignment-card {
        border: none;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 15px 35px rgba(0, 0, 0, .18);
        transition: .3s;
    }

    .assignment-card:hover {
        transform: translateY(-5px);
    }

    .assignment-header {
        background: linear-gradient(90deg, #233945, #2f4d5a);
        color: white;
        padding: 18px;
        text-align: center;
    }

    .assignment-header h2 {
        margin: 0;
        font-weight: 600;
    }

    .form-control {
        height: 45px;
        border-radius: 10px;
    }

    .input-group-text {
        background: #233945;
        color: white;
        border-radius: 10px 0 0 10px;
    }

    .form-control:focus {
        border-color: #233945;
        box-shadow: 0 0 0 .2rem rgba(35, 57, 69, .15);
    }

    .form-label {
        font-weight: 600;
        color: #233945;
    }

    .btn {
        border-radius: 10px;
        font-weight: 600;
        min-width: 130px;
    }

    .btn-success {
        background: #198754;
    }

    .btn-primary {
        background: #233945;
        border-color: #233945;
    }

    .btn-primary:hover {
        background: #2f4d5a;
    }

    .text-danger {
        font-size: 13px;
    }
</style>

<app-navbar></app-navbar>

<div class="assignment-bg">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-6">

                <div class="card assignment-card">

                    <div class="assignment-header">

                        <h2 *ngIf="!form.data.id">
                            <i class="fas fa-book-open me-2"></i>
                            Add Assignment
                        </h2>

                        <h2 *ngIf="form.data.id > 0">
                            <i class="fas fa-edit me-2"></i>
                            Update Assignment
                        </h2>

                    </div>

                    <div class="card-body p-4">

                        <div *ngIf="!form.error && form.message" class="alert alert-success text-center">
                            {{form.message}}
                        </div>

                        <div *ngIf="form.error && form.message" class="alert alert-danger text-center">
                            {{form.message}}
                        </div>

                        <!-- Title -->

                        <label class="form-label">
                            <i class="fas fa-heading me-2"></i>
                            Title <span class="text-danger">*</span>
                        </label>

                        <div class="input-group mb-2">

                            <span class="input-group-text">
                                <i class="fas fa-heading"></i>
                            </span>

                            <input type="text" class="form-control" name="title" [(ngModel)]="form.data.title"
                                placeholder="Enter Assignment Title">

                        </div>

                        <small class="text-danger">
                            {{form.inputerror.title}}
                        </small>

                        <br>

                        <!-- Due Date -->

                        <label class="form-label">
                            <i class="fas fa-calendar-alt me-2"></i>
                            Due Date <span class="text-danger">*</span>
                        </label>

                        <div class="input-group mb-2">

                            <span class="input-group-text">
                                <i class="fas fa-calendar-alt"></i>
                            </span>

                            <input type="date" class="form-control" name="dueDate" [(ngModel)]="form.data.dueDate">

                        </div>

                        <small class="text-danger">
                            {{form.inputerror.dueDate}}
                        </small>

                        <br>

                        <!-- Subject -->

                        <label class="form-label">
                            <i class="fas fa-book me-2"></i>
                            Subject <span class="text-danger">*</span>
                        </label>

                        <div class="input-group mb-2">

                            <span class="input-group-text">
                                <i class="fas fa-book"></i>
                            </span>

                            <input type="text" class="form-control" name="subject" [(ngModel)]="form.data.subject"
                                placeholder="Enter Subject">

                        </div>

                        <small class="text-danger">
                            {{form.inputerror.subject}}
                        </small>

                        <br>

                        <!-- Marks -->

                        <label class="form-label">
                            <i class="fas fa-star me-2"></i>
                            Marks <span class="text-danger">*</span>
                        </label>

                        <div class="input-group mb-2">

                            <span class="input-group-text">
                                <i class="fas fa-star"></i>
                            </span>

                            <input type="text" class="form-control" name="marks" [(ngModel)]="form.data.marks"
                                placeholder="Enter Marks">

                        </div>

                        <small class="text-danger">
                            {{form.inputerror.marks}}
                        </small>

                        <hr class="my-4">

                        <div class="text-center">

                            <button class="btn btn-success btn-lg me-3" (click)="submit()">
                                <i class="fas fa-save me-2"></i>
                                Save
                            </button>

                            &nbsp;&nbsp;

                            <button class="btn btn-primary btn-lg" (click)="forward('/assignmentlist')">
                                <i class="fas fa-list me-2"></i>
                                List
                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<app-footer></app-footer>
