<style>
  .marksheet-bg {
    min-height: 100vh;
    background: linear-gradient(135deg, #edf4f7, #f8fbfc);
    padding-top: 100px;
    padding-bottom: 50px;
  }

  .marksheet-card {
    border: none;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 15px 35px rgba(0, 0, 0, .18);
    transition: .3s;
  }

  .marksheet-card:hover {
    transform: translateY(-5px);
  }

  .marksheet-header {
    background: linear-gradient(90deg, #233945, #2f4d5a);
    color: white;
    padding: 18px;
    text-align: center;
  }

  .marksheet-header h2 {
    margin: 0;
    font-weight: 600;
  }

  .form-control {
    height: 45px;
    border-radius: 10px;
  }

  .input-group-text {
    background: #233945;
    color: white;
    border-radius: 10px 0 0 10px;
  }

  .form-control:focus {
    border-color: #233945;
    box-shadow: 0 0 0 .2rem rgba(35, 57, 69, .15);
  }

  .form-label {
    font-weight: 600;
    color: #233945;
  }

  .btn {
    border-radius: 10px;
    font-weight: 600;
    min-width: 130px;
  }

  .btn-success {
    background: #198754;
  }

  .btn-primary {
    background: #233945;
    border-color: #233945;
  }

  .btn-primary:hover {
    background: #2f4d5a;
  }

  .text-danger {
    font-size: 13px;
  }
</style>


<app-navbar></app-navbar>


<div class="marksheet-bg">

  <div class="container">

    <div class="row justify-content-center">

      <div class="col-lg-6">


        <div class="card marksheet-card">


          <div class="marksheet-header">

            <h2 *ngIf="!form.data.id">
              <i class="fas fa-file-alt me-2"></i>
              Add Marksheet
            </h2>

            <h2 *ngIf="form.data.id > 0">
              <i class="fas fa-edit me-2"></i>
              Update Marksheet
            </h2>

          </div>


          <div class="card-body p-4">


            <div *ngIf="!form.error && form.message" class="alert alert-success text-center">

              {{form.message}}

            </div>


            <div *ngIf="form.error && form.message" class="alert alert-danger text-center">

              {{form.message}}

            </div>



            <!-- Roll No -->

            <label class="form-label">
              <i class="fas fa-id-card me-2"></i>
              Roll No <span class="text-danger">*</span>
            </label>


            <div class="input-group mb-2">

              <span class="input-group-text">
                <i class="fas fa-id-card"></i>
              </span>


              <input type="text" class="form-control" name="rollNo" maxlength="5" [(ngModel)]="form.data.rollNo"
                placeholder="Enter Roll No">

            </div>

            <small class="text-danger">
              {{form.inputerror.rollNo}}
            </small>




            <br>


            <!-- Student -->

            <label class="form-label">
              <i class="fas fa-user me-2"></i>
              Name <span class="text-danger">*</span>
            </label>


            <div class="input-group mb-2">

              <span class="input-group-text">
                <i class="fas fa-user"></i>
              </span>


              <select name="studentId" class="form-control" [(ngModel)]="form.data.studentId">


                <option value="undefined">
                  ------------Select------------
                </option>


                <option *ngFor="let obj of form.preload.studentList" [value]="obj.key">

                  {{obj.value}}

                </option>


              </select>


            </div>


            <small class="text-danger">
              {{form.inputerror.studentId}}
            </small>



            <br>



            <!-- Physics -->

            <label class="form-label">
              <i class="fas fa-flask me-2"></i>
              Physics <span class="text-danger">*</span>
            </label>


            <div class="input-group mb-2">

              <span class="input-group-text">
                <i class="fas fa-flask"></i>
              </span>


              <input type="text" class="form-control" name="physics" maxlength="3" [(ngModel)]="form.data.physics"
                placeholder="Enter Physics Marks">


            </div>


            <small class="text-danger">
              {{form.inputerror.physics}}
            </small>


            <br>



            <!-- Chemistry -->

            <label class="form-label">
              <i class="fas fa-vial me-2"></i>
              Chemistry <span class="text-danger">*</span>
            </label>


            <div class="input-group mb-2">


              <span class="input-group-text">
                <i class="fas fa-vial"></i>
              </span>


              <input type="text" class="form-control" name="chemistry" maxlength="3" [(ngModel)]="form.data.chemistry"
                placeholder="Enter Chemistry Marks">


            </div>


            <small class="text-danger">
              {{form.inputerror.chemistry}}
            </small>


            <br>




            <!-- Maths -->

            <label class="form-label">
              <i class="fas fa-calculator me-2"></i>
              Maths <span class="text-danger">*</span>
            </label>


            <div class="input-group mb-2">


              <span class="input-group-text">
                <i class="fas fa-calculator"></i>
              </span>


              <input type="text" class="form-control" name="maths" maxlength="3" [(ngModel)]="form.data.maths"
                placeholder="Enter Maths Marks">


            </div>


            <small class="text-danger">
              {{form.inputerror.maths}}
            </small>




            <hr class="my-4">



            <div class="text-center">


              <button class="btn btn-success btn-lg me-3" (click)="submit()">

                <i class="fas fa-save me-2"></i>
                Save

              </button>



              <button class="btn btn-primary btn-lg" (click)="forward('marksheetlist')">

                <i class="fas fa-list me-2"></i>
                List

              </button>


            </div>



          </div>


        </div>


      </div>

    </div>

  </div>

</div>



<app-footer></app-footer>
