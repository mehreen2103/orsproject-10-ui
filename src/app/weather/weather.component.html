<style type="text/css">
    .input-group-addon {
        box-shadow: 9px 8px 7px #001a33;
    }

    .hm {
        background-image: url('assets/files/add.png');
        background-repeat: no-repeat;
        background-attachment: fixed;
        background-size: cover;
        padding-top: 5px;
        padding-bottom: 25px;
    }
</style>

<app-navbar></app-navbar>

<div class="hm">
    <main>
        <div class="row pt-3">

            <div class="col-md-4 mb-4"></div>

            <div class="col-md-4 mb-4">
                <div class="card input-group-addon">
                    <div class="card-body">

                        <h3 *ngIf="!form.data.id" class="text-center default-text text-dark">
                            Add Weather
                        </h3>

                        <h3 *ngIf="form.data.id > 0" class="text-center default-text text-dark">
                            Update Weather
                        </h3>

                        <div>
                            <h4 align="center">
                                <div *ngIf="!form.error && form.message" class="alert alert-success alert-dismissible">
                                    <button type="button" class="close" data-dismiss="alert">&times;</button>
                                    {{form.message}}
                                </div>
                            </h4>

                            <h4 align="center">
                                <div *ngIf="form.error && form.message" class="alert alert-danger alert-dismissible">
                                    <button type="button" class="close" data-dismiss="alert">&times;</button>
                                    {{form.message}}
                                </div>
                            </h4>
                        </div>

                        <form (ngSubmit)="submit()">

                            <div class="md-form">

                                <!-- Alert Code -->

                                <span class="pl-sm-5">
                                    <b>Alert Code</b>
                                    <span style="color:red">*</span>
                                </span><br>

                                <div class="col-sm-12">

                                    <div class="input-group">

                                        <div class="input-group-prepend">

                                            <div class="input-group-text">
                                                <i class="fa fa-exclamation-triangle"></i>
                                            </div>

                                        </div>

                                        <input type="text" class="form-control" name="alertCode"
                                            [(ngModel)]="form.data.alertCode" placeholder="Enter Alert Code">

                                    </div>

                                </div>

                                <font color="red" class="pl-sm-5">
                                    {{form.inputerror.alertCode}}
                                </font>

                                <br>

                                <!-- City Name -->

                                <span class="pl-sm-5">
                                    <b>City Name</b>
                                    <span style="color:red">*</span>
                                </span><br>

                                <div class="col-sm-12">

                                    <div class="input-group">

                                        <div class="input-group-prepend">

                                            <div class="input-group-text">
                                                <i class="fa fa-building"></i>
                                            </div>

                                        </div>

                                        <input type="text" class="form-control" name="cityName"
                                            [(ngModel)]="form.data.cityName" placeholder="Enter City Name">

                                    </div>

                                </div>

                                <font color="red" class="pl-sm-5">
                                    {{form.inputerror.cityName}}
                                </font>

                                <br>

                                <!-- Temperature -->

                                <span class="pl-sm-5">
                                    <b>Temperature</b>
                                    <span style="color:red">*</span>
                                </span><br>

                                <div class="col-sm-12">

                                    <div class="input-group">

                                        <div class="input-group-prepend">

                                            <div class="input-group-text">
                                                <i class="fa fa-thermometer-half"></i>
                                            </div>

                                        </div>

                                        <input type="text" class="form-control" name="temperature"
                                            [(ngModel)]="form.data.temperature" placeholder="Enter Temperature">

                                    </div>

                                </div>

                                <font color="red" class="pl-sm-5">
                                    {{form.inputerror.temperature}}
                                </font>

                                <br>

                                <!-- Status -->

                                <span class="pl-sm-5">
                                    <b>Status</b>
                                    <span style="color:red">*</span>
                                </span><br>

                                <div class="col-sm-12">

                                    <div class="input-group">

                                        <div class="input-group-prepend">

                                            <div class="input-group-text">
                                                <i class="fa fa-cloud"></i>
                                            </div>

                                        </div>

                                        <select class="form-control" name="status" [(ngModel)]="form.data.status">

                                            <option value="undefined"> Select </option>

                                            <option value="Sunny"> Sunny</option>

                                            <option value="Cloudy"> Cloudy</option>

                                            <option value="Rainy">  Rainy</option>

                                            <option value="Storm">   Storm </option>

                                        </select>

                                    </div>

                                </div>

                                <font color="red" class="pl-sm-5">
                                    {{form.inputerror.status}}
                                </font>

                                <br>

                                <!-- Buttons -->

                                <div class="text-center">

                                    <button type="submit" class="btn btn-success" style="font-size:17px">

                                        Save

                                    </button>

                                    &nbsp;

                                    <button type="button" class="btn btn-warning" style="font-size:17px"
                                        (click)="forward('/weatherlist')">

                                        List

                                    </button>

                                </div>

                            </div>

                        </form>

                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-4"></div>

        </div>
    </main>
</div>

<app-footer></app-footer>
