<style>
    .atm-bg {
        min-height: 100vh;
        background: linear-gradient(135deg, #edf4f7, #f8fbfc);
        padding-top: 100px;
        padding-bottom: 50px;
    }

    .atm-card {
        border: none;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 15px 35px rgba(0, 0, 0, .18);
        transition: .3s;
    }

    .atm-card:hover {
        transform: translateY(-5px);
    }

    .atm-header {
        background: linear-gradient(90deg, #233945, #2f4d5a);
        color: white;
        padding: 18px;
        text-align: center;
    }

    .atm-header h2 {
        margin: 0;
        font-weight: 600;
    }

    .form-control {
        height: 45px;
        border-radius: 10px;
    }

    .input-group-text {
        background: #233945;
        color: white;
        border-radius: 10px 0 0 10px;
    }

    .form-control:focus {
        border-color: #233945;
        box-shadow: 0 0 0 .2rem rgba(35, 57, 69, .15);
    }

    .form-label {
        font-weight: 600;
        color: #233945;
    }

    .btn {
        border-radius: 10px;
        font-weight: 600;
        min-width: 130px;
    }

    .btn-success {
        background: #198754;
    }

    .btn-primary {
        background: #233945;
        border-color: #233945;
    }

    .btn-primary:hover {
        background: #2f4d5a;
    }

    .text-danger {
        font-size: 13px;
    }
</style>

<app-navbar></app-navbar>

<div class="atm-bg">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-6">

                <div class="card atm-card">

                    <div class="atm-header">

                        <h2 *ngIf="!form.data.id">
                            <i class="fas fa-money-bill-wave me-2"></i>
                            Add Payment
                        </h2>

                        <h2 *ngIf="form.data.id > 0">
                            <i class="fas fa-edit me-2"></i>
                            Update Payment
                        </h2>

                    </div>

                    <div class="card-body p-4">

                        <div *ngIf="!form.error && form.message" class="alert alert-success text-center">
                            {{form.message}}
                        </div>

                        <div *ngIf="form.error && form.message" class="alert alert-danger text-center">
                            {{form.message}}
                        </div>

                        <!-- Amount -->

                        <label class="form-label">
                            <i class="fas fa-rupee-sign me-2"></i>
                            Amount <span class="text-danger">*</span>
                        </label>

                        <div class="input-group mb-2">

                            <span class="input-group-text">
                                <i class="fas fa-rupee-sign"></i>
                            </span>

                            <input type="text" class="form-control" name="amount" [(ngModel)]="form.data.amount"
                                placeholder="Enter Amount">

                        </div>

                        <small class="text-danger">
                            {{form.inputerror.amount}}
                        </small>

                        <br>

                        <!-- Payment Date -->

                        <label class="form-label">
                            <i class="fas fa-calendar-alt me-2"></i>
                            Payment Date <span class="text-danger">*</span>
                        </label>

                        <div class="input-group mb-2">

                            <span class="input-group-text">
                                <i class="fas fa-calendar-alt"></i>
                            </span>

                            <input type="date" class="form-control" name="paymentDate"
                                [(ngModel)]="form.data.paymentDate" placeholder="Enter Payment Date">

                        </div>

                        <small class="text-danger">
                            {{form.inputerror.paymentDate}}
                        </small>

                        <br>

                        <!-- Payment Method -->

                        <!-- Payment Method -->

                        <label class="form-label">
                            <i class="fas fa-credit-card me-2"></i>
                            Payment Method <span class="text-danger">*</span>
                        </label>

                        <div class="input-group mb-2">

                            <span class="input-group-text">
                                <i class="fas fa-credit-card"></i>
                            </span>

                            <select class="form-control" name="paymentMethod" [(ngModel)]="form.data.paymentMethod">
                                <option value="undefined">-- Select Payment Method --</option>
                                <option value="Cash">Cash</option>
                                <option value="Credit Card">Credit Card</option>
                                <option value="Debit Card">Debit Card</option>
                                <option value="UPI">UPI</option>
                                <option value="Net Banking">Net Banking</option>
                                <option value="Wallet">Wallet</option>
                            </select>

                        </div>

                        <small class="text-danger">
                            {{form.inputerror.paymentMethod}}
                        </small>

                        <br>

                        <!-- Transaction Id -->

                        <label class="form-label">
                            <i class="fas fa-hashtag me-2"></i>
                            Transaction Id <span class="text-danger">*</span>
                        </label>

                        <div class="input-group mb-2">

                            <span class="input-group-text">
                                <i class="fas fa-hashtag"></i>
                            </span>

                            <input type="text" class="form-control" name="transactionId"
                                [(ngModel)]="form.data.transactionId" placeholder="Enter Transaction Id">

                        </div>

                        <small class="text-danger"> {{form.inputerror.transactionId}} </small>

                        <hr class="my-4">

                        <div class="text-center">

                            <button class="btn btn-success btn-lg me-3" (click)="submit()">
                                <i class="fas fa-save me-2"></i>
                                Save
                            </button>

                            &nbsp;&nbsp;

                            <button class="btn btn-primary btn-lg" (click)="forward('/paymentlist')">
                                <i class="fas fa-list me-2"></i>
                                List
                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<br>

<app-footer></app-footer>
