<style type="text/css">
    .input-group-addon {
        box-shadow: 9px 8px 7px #001a33;
    }

    .hm {
        background-image: url('assets/files/add.png');
        background-repeat: no-repeat;
        background-attachment: fixed;
        background-size: cover;
        padding-top: 5px;
        padding-bottom: 25px;
    }
</style>

<app-navbar></app-navbar>

<div class="hm">
    <main>
        <div class="row pt-3">

            <div class="col-md-4 mb-4"></div>

            <div class="col-md-4 mb-4">
                <div class="card input-group-addon">
                    <div class="card-body">

                        <h3 *ngIf="!form.data.id" class="text-center default-text text-dark">
                            Add Drone
                        </h3>

                        <h3 *ngIf="form.data.id > 0" class="text-center default-text text-dark">
                            Update Drone
                        </h3>

                        <div>
                            <h4 align="center">
                                <div *ngIf="!form.error && form.message" class="alert alert-success alert-dismissible">
                                    <button type="button" class="close" data-dismiss="alert">&times;</button>
                                    {{form.message}}
                                </div>
                            </h4>

                            <h4 align="center">
                                <div *ngIf="form.error && form.message" class="alert alert-danger alert-dismissible">
                                    <button type="button" class="close" data-dismiss="alert">&times;</button>
                                    {{form.message}}
                                </div>
                            </h4>
                        </div>

                        <form (ngSubmit)="submit()">

                            <div class="md-form">

                                <!-- Drone Code -->

                                <span class="pl-sm-5"> <b>Drone Code</b> <span style="color:red">*</span> </span><br>

                                <div class="col-sm-12">

                                    <div class="input-group">

                                        <div class="input-group-prepend">

                                            <div class="input-group-text"> <i class="fa fa-helicopter"></i> </div>

                                        </div>

                                        <input type="text" class="form-control" name="droneCode" [(ngModel)]="form.data.droneCode" placeholder="Enter Drone Code">

                                    </div>

                                </div>

                                <font color="red" class="pl-sm-5">{{form.inputerror.droneCode}} </font>

                                <br>

                                <!-- Operator Name -->

                                <span class="pl-sm-5">  <b>Operator Name</b><span style="color:red">*</span> </span><br>

                                <div class="col-sm-12">

                                    <div class="input-group">

                                        <div class="input-group-prepend">

                                            <div class="input-group-text">  <i class="fa fa-user"></i></div>

                                        </div>

                                        <input type="text" class="form-control" name="operatorName" [(ngModel)]="form.data.operatorName" placeholder="Enter Operator Name">

                                    </div>

                                </div>

                                <font color="red" class="pl-sm-5"> {{form.inputerror.operatorName}} </font>

                                <br>

                                <!-- Delivery Zone -->

                                <span class="pl-sm-5"> <b>Delivery Zone</b> <span style="color:red">*</span>
                                </span><br>

                                <div class="col-sm-12">

                                    <div class="input-group">

                                        <div class="input-group-prepend">

                                            <div class="input-group-text"><i class="fa fa-map-marker"></i>  </div>

                                        </div>

                                        <input type="text" class="form-control" name="deliveryZone" [(ngModel)]="form.data.deliveryZone" placeholder="Enter Delivery Zone">

                                    </div>

                                </div>

                                <font color="red" class="pl-sm-5"> {{form.inputerror.deliveryZone}} </font>

                                <br>

                                <!-- Status -->

                                <span class="pl-sm-5"> <b>Status</b><span style="color:red">*</span></span><br>

                                <div class="col-sm-12">

                                    <div class="input-group">

                                        <div class="input-group-prepend">

                                            <div class="input-group-text"><i class="fa fa-info-circle"></i> </div>

                                        </div>

                                        <select class="form-control" name="status" [(ngModel)]="form.data.status">

                                            <option value="undefined">Select </option>

                                            <option value="Available">Available</option>

                                            <option value="In Transit"> In Transit</option>

                                            <option value="Charging"> Charging</option>

                                            <option value="Maintenance"> Maintenance</option>

                                        </select>

                                    </div>

                                </div>

                                <font color="red" class="pl-sm-5">
                                    {{form.inputerror.status}}
                                </font>

                                <br>

                                <!-- Buttons -->

                                <div class="text-center">

                                    <button type="submit" class="btn btn-success" style="font-size:17px">

                                        Save

                                    </button>

                                    &nbsp;

                                    <button type="button" class="btn btn-warning" style="font-size:17px"
                                        (click)="forward('/dronelist')">

                                        List

                                    </button>

                                </div>

                            </div>

                        </form>

                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-4"></div>

        </div>
    </main>
</div>

<app-footer></app-footer>
