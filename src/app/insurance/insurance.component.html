<style>
    .insurance-bg {
        min-height: 100vh;
        background: linear-gradient(135deg, #edf4f7, #f8fbfc);
        padding-top: 100px;
        padding-bottom: 50px;
    }

    .insurance-card {
        border: none;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 15px 35px rgba(0, 0, 0, .18);
        transition: .3s;
    }

    .insurance-card:hover {
        transform: translateY(-5px);
    }

    .insurance-header {
        background: linear-gradient(90deg, #233945, #2f4d5a);
        color: white;
        padding: 18px;
        text-align: center;
    }

    .insurance-header h2 {
        margin: 0;
        font-weight: 600;
    }

    .form-control {
        height: 45px;
        border-radius: 10px;
    }

    .input-group-text {
        background: #233945;
        color: white;
        border-radius: 10px 0 0 10px;
    }

    .form-control:focus {
        border-color: #233945;
        box-shadow: 0 0 0 .2rem rgba(35, 57, 69, .15);
    }

    .form-label {
        font-weight: 600;
        color: #233945;
    }

    .btn {
        border-radius: 10px;
        font-weight: 600;
        min-width: 130px;
    }

    .btn-success {
        background: #198754;
    }

    .btn-primary {
        background: #233945;
        border-color: #233945;
    }

    .btn-primary:hover {
        background: #2f4d5a;
    }

    .text-danger {
        font-size: 13px;
    }
</style>

<app-navbar></app-navbar>

<div class="insurance-bg">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-6">

                <div class="card insurance-card">

                    <div class="insurance-header">

                        <h2 *ngIf="!form.data.id">
                            <i class="fas fa-shield-alt me-2"></i>
                            Add Insurance
                        </h2>

                        <h2 *ngIf="form.data.id > 0">
                            <i class="fas fa-edit me-2"></i>
                            Update Insurance
                        </h2>

                    </div>

                    <div class="card-body p-4">

                        <div *ngIf="!form.error && form.message" class="alert alert-success text-center">
                            {{form.message}}
                        </div>

                        <div *ngIf="form.error && form.message" class="alert alert-danger text-center">
                            {{form.message}}
                        </div>

                        <!-- Policy Holder Name -->

                        <label class="form-label">
                            <i class="fas fa-user me-2"></i>
                            Policy Holder Name <span class="text-danger">*</span>
                        </label>

                        <div class="input-group mb-2">

                            <span class="input-group-text">
                                <i class="fas fa-user"></i>
                            </span>

                            <input type="text" class="form-control" name="policyHolderName"
                                [(ngModel)]="form.data.policyHolderName" placeholder="Enter Policy Holder Name">

                        </div>

                        <small class="text-danger">
                            {{form.inputerror.policyHolderName}}
                        </small>

                        <br>

                        <!-- Policy Type -->

                        <label class="form-label">
                            <i class="fas fa-file-contract me-2"></i>
                            Policy Type <span class="text-danger">*</span>
                        </label>

                        <div class="input-group mb-2">

                            <span class="input-group-text">
                                <i class="fas fa-file-contract"></i>
                            </span>

                            <input type="text" class="form-control" name="policyType" [(ngModel)]="form.data.policyType"
                                placeholder="Enter Policy Type">

                        </div>

                        <small class="text-danger">
                            {{form.inputerror.policyType}}
                        </small>

                        <br>

                        <!-- Premium Amount -->

                        <label class="form-label">
                            <i class="fas fa-money-bill-wave me-2"></i>
                            Premium Amount <span class="text-danger">*</span>
                        </label>

                        <div class="input-group mb-2">

                            <span class="input-group-text">
                                <i class="fas fa-money-bill-wave"></i>
                            </span>

                            <input type="text" class="form-control" name="premiumAmount"
                                [(ngModel)]="form.data.premiumAmount" placeholder="Enter Premium Amount">

                        </div>

                        <small class="text-danger">
                            {{form.inputerror.premiumAmount}}
                        </small>

                        <br>

                        <!-- Expiry Date -->

                        <label class="form-label">
                            <i class="fas fa-calendar-alt me-2"></i>
                            Expiry Date <span class="text-danger">*</span>
                        </label>

                        <div class="input-group mb-2">

                            <span class="input-group-text">
                                <i class="fas fa-calendar-alt"></i>
                            </span>

                            <input type="date" class="form-control" name="expiryDate"
                                [(ngModel)]="form.data.expiryDate">

                        </div>

                        <small class="text-danger">
                            {{form.inputerror.expiryDate}}
                        </small>

                        <hr class="my-4">

                        <div class="text-center">

                            <button class="btn btn-success btn-lg me-3" (click)="submit()">
                                <i class="fas fa-save me-2"></i>
                                Save
                            </button>

                            &nbsp;&nbsp;

                            <button class="btn btn-primary btn-lg" (click)="forward('/insurancelist')">
                                <i class="fas fa-list me-2"></i>
                                List
                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<app-footer></app-footer>
