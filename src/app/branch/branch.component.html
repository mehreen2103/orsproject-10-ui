<style type="text/css">
    .input-group-addon {
        box-shadow: 9px 8px 7px #001a33;
    }

    .hm {
        background-image: url('assets/files/add.png');
        background-repeat: no-repeat;
        background-attachment: fixed;
        background-size: cover;
        padding-top: 5px;
        padding-bottom: 25px;
    }
</style>

<app-navbar></app-navbar>

<div class="hm">
    <main>
        <div class="row pt-3">

            <div class="col-md-4 mb-4"></div>

            <div class="col-md-4 mb-4">
                <div class="card input-group-addon">
                    <div class="card-body">

                        <h3 *ngIf="!form.data.id" class="text-center default-text text-dark">
                            Add Branch
                        </h3>

                        <h3 *ngIf="form.data.id > 0" class="text-center default-text text-dark">
                            Update Branch
                        </h3>

                        <div>
                            <h4 align="center">
                                <div *ngIf="!form.error && form.message" class="alert alert-success alert-dismissible">
                                    <button type="button" class="close" data-dismiss="alert">&times;</button>
                                    {{form.message}}
                                </div>
                            </h4>

                            <h4 align="center">
                                <div *ngIf="form.error && form.message" class="alert alert-danger alert-dismissible">
                                    <button type="button" class="close" data-dismiss="alert">&times;</button>
                                    {{form.message}}
                                </div>
                            </h4>
                        </div>

                        <form (ngSubmit)="submit()">

                            <div class="md-form">

                                <!-- Branch Name -->

                                <span class="pl-sm-5">
                                    <b>Branch Name</b>
                                    <span style="color:red">*</span>
                                </span><br>

                                <div class="col-sm-12">
                                    <div class="input-group">

                                        <div class="input-group-prepend">
                                            <div class="input-group-text">
                                                <i class="fa fa-building"></i>
                                            </div>
                                        </div>

                                        <input type="text" class="form-control" name="branchName"
                                            [(ngModel)]="form.data.branchName" placeholder="Enter Branch Name">

                                    </div>
                                </div>

                                <font color="red" class="pl-sm-5">
                                    {{form.inputerror.branchName}}
                                </font>

                                <br>

                                <!-- City -->

                                <span class="pl-sm-5">
                                    <b>City</b>
                                    <span style="color:red">*</span>
                                </span><br>

                                <div class="col-sm-12">
                                    <div class="input-group">

                                        <div class="input-group-prepend">
                                            <div class="input-group-text">
                                                <i class="fa fa-map-marker"></i>
                                            </div>
                                        </div>

                                        <input type="text" class="form-control" name="city" [(ngModel)]="form.data.city"
                                            placeholder="Enter City">

                                    </div>
                                </div>

                                <font color="red" class="pl-sm-5">
                                    {{form.inputerror.city}}
                                </font>

                                <br>

                                <!-- Manager Name -->

                                <span class="pl-sm-5">
                                    <b>Manager Name</b>
                                    <span style="color:red">*</span>
                                </span><br>

                                <div class="col-sm-12">
                                    <div class="input-group">

                                        <div class="input-group-prepend">
                                            <div class="input-group-text">
                                                <i class="fa fa-user"></i>
                                            </div>
                                        </div>

                                        <input type="text" class="form-control" name="managerName"
                                            [(ngModel)]="form.data.managerName" placeholder="Enter Manager Name">

                                    </div>
                                </div>

                                <font color="red" class="pl-sm-5">
                                    {{form.inputerror.managerName}}
                                </font>

                                <br>

                                <!-- Contact Number -->

                                <span class="pl-sm-5">
                                    <b>Contact No</b>
                                    <span style="color:red">*</span>
                                </span><br>

                                <div class="col-sm-12">
                                    <div class="input-group">

                                        <div class="input-group-prepend">
                                            <div class="input-group-text">
                                                <i class="fa fa-phone"></i>
                                            </div>
                                        </div>

                                        <input type="text" class="form-control" name="contactNo"
                                            [(ngModel)]="form.data.contactNo" placeholder="Enter Contact Number">

                                    </div>
                                </div>

                                <font color="red" class="pl-sm-5">
                                    {{form.inputerror.contactNo}}
                                </font>

                                <br>

                                <!-- Buttons -->

                                <div class="text-center">

                                    <button type="submit" class="btn btn-success" style="font-size:17px">
                                        Save
                                    </button>

                                    &nbsp;

                                    <button type="button" class="btn btn-warning" style="font-size:17px"
                                        (click)="forward('/branchlist')">
                                        List
                                    </button>

                                </div>

                            </div>

                        </form>

                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-4"></div>

        </div>
    </main>
</div>

<app-footer></app-footer>
